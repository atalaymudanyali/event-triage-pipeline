[project]
name = "triage-pipeline"
version = "0.1.0"
description = "Event-driven AI triage pipeline — an LLM agent that consumes support ticket events from Redpanda, classifies and triages them, and writes decisions to Postgres."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "google-genai>=1.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
produce = "triage_pipeline.producer:main"
consume = "triage_pipeline.consumer:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
