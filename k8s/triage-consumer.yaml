apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-consumer
  namespace: triage-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-consumer
  template:
    metadata:
      labels:
        app: triage-consumer
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-for-redpanda
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z redpanda 9092; do sleep 2; done"]
      containers:
        - name: consumer
          image: triage-pipeline:latest
          imagePullPolicy: Never
          command: ["uv", "run", "consume"]
          ports:
            - containerPort: 8001
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: triage-secrets
                  key: GEMINI_API_KEY
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: triage-secrets
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda:9092
---
apiVersion: v1
kind: Service
metadata:
  name: triage-consumer
  namespace: triage-pipeline
spec:
  selector:
    app: triage-consumer
  ports:
    - port: 8001
      targetPort: 8001
