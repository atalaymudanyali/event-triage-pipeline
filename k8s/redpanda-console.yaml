apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: triage-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z redpanda 9092; do sleep 2; done"]
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v2.8.2
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: redpanda:9092
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: triage-pipeline
spec:
  type: NodePort
  selector:
    app: redpanda-console
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30890
