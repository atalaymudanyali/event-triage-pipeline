apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-api
  namespace: triage-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-api
  template:
    metadata:
      labels:
        app: triage-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-for-redpanda
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z redpanda 9092; do sleep 2; done"]
      containers:
        - name: api
          image: triage-pipeline:latest
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: triage-secrets
                  key: GEMINI_API_KEY
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: triage-secrets
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda:9092
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: triage-api
  namespace: triage-pipeline
spec:
  type: NodePort
  selector:
    app: triage-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
