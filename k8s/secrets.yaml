# Do NOT apply this file directly — the setup script creates
# the secret imperatively from your .env file.
# This template exists only for documentation.
apiVersion: v1
kind: Secret
metadata:
  name: triage-secrets
  namespace: triage-pipeline
type: Opaque
data:
  GEMINI_API_KEY: <base64-encoded>
  POSTGRES_PASSWORD: <base64-encoded>
